# Publishes the DailyList website and admin panel (/panel) to GitHub Pages at dailylist.yashrajsinhjadeja.com.
# They talk to the API at dailylist-api.yashrajsinhjadeja.com. The API itself runs on your own server.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
        env:
          # address of the API server; override it with a repository variable named API_URL if it ever moves
          VITE_API_URL: ${{ vars.API_URL || 'https://dailylist-api.yashrajsinhjadeja.com' }}
          # shown on the website when there is no server to ask
          VITE_PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.dailylist
          VITE_SUPPORT_EMAIL: yashrajsinhjadeja757@gmail.com
          VITE_SUPPORT_PHONE: '+91 97255 25757'
      - name: Single page app support and custom domain
        working-directory: admin/dist
        run: |
          cp index.html 404.html
          echo "dailylist.yashrajsinhjadeja.com" > CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
